version: 2
name: "Full Body Hypertrophy"
source_of_truth: true

default_program: 2d

principles:
  goal: hypertrophy
  priorities:
    - deltoids
    - chest
    - back
  effort:
    compounds: "1-3 RIR"
    isolations: "0-2 RIR"
  progression:
    rule: "Add reps within the target range first; add load once the top of the range is reached with target RIR and stable technique."
  fatigue:
    rule: "Prefer fewer high-quality sets over adding low-value volume. Reduce auxiliary work first if post-session systemic fatigue is excessive."

volume_model:
  taxonomy: "Everkinetic-inspired primary / secondary muscle targets"
  source: "https://github.com/everkinetic/data"
  license: "CC BY-SA 4.0"
  weights:
    primary: 1.0
    secondary: 0.33

patterns:
  horizontal_push:
    examples: ["chest press", "cable press", "machine press"]
    targets:
      chest: primary
      triceps: secondary
      anterior_deltoid: secondary
  vertical_pull:
    examples: ["pull-up", "lat pulldown"]
    targets:
      lats: primary
      biceps: secondary
      middle_back: secondary
  horizontal_pull:
    examples: ["chest-supported row", "cable row", "machine row"]
    targets:
      middle_back: primary
      lats: secondary
      biceps: secondary
      posterior_deltoid: secondary
  squat:
    examples: ["pendulum squat", "leg press"]
    targets:
      quadriceps: primary
      glutes: secondary
  hamstring_hinge:
    examples: ["RDL"]
    targets:
      hamstrings: primary
      glutes: primary
      lower_back: secondary
  hamstring_curl:
    examples: ["seated leg curl", "lying leg curl"]
    targets:
      hamstrings: primary
  leg_extension:
    examples: ["leg extension"]
    targets:
      quadriceps: primary
  side_delt:
    examples: ["single-arm cable lateral raise"]
    targets:
      lateral_deltoid: primary
  rear_delt:
    examples: ["reverse fly"]
    targets:
      posterior_deltoid: primary
      middle_back: secondary
  biceps:
    examples: ["incline curl", "cable curl", "Zottman curl"]
    targets:
      biceps: primary
      forearms: secondary
  triceps:
    examples: ["skullcrusher"]
    targets:
      triceps: primary
  abs:
    examples: ["cable crunch"]
    targets:
      abdominals: primary

programs:
  2d:
    label: "2 days"
    frequency_per_week: 2
    description: "Two larger full-body sessions with all major patterns exposed across the week."
    sessions:
      A:
        - pattern: squat
          sets: 3
          reps: "6-12"
        - pattern: horizontal_push
          sets: 3
          reps: "6-12"
        - pattern: vertical_pull
          sets: 3
          reps: "6-12"
        - pattern: horizontal_pull
          sets: 3
          reps: "8-15"
        - pattern: hamstring_hinge
          sets: 3
          reps: "6-12"
        - pattern: side_delt
          sets: 3
          reps: "10-20"
        - pattern: rear_delt
          sets: 2
          reps: "10-20"
        - pattern: biceps
          sets: 1
          reps: "8-15"
        - pattern: triceps
          sets: 2
          reps: "8-15"
        - pattern: abs
          sets: 2
          reps: "8-15"
          optional: true
      B:
        - pattern: squat
          sets: 3
          reps: "6-12"
        - pattern: horizontal_push
          sets: 3
          reps: "6-12"
        - pattern: vertical_pull
          sets: 3
          reps: "6-12"
        - pattern: horizontal_pull
          sets: 3
          reps: "8-15"
        - pattern: hamstring_curl
          sets: 3
          reps: "8-15"
        - pattern: leg_extension
          sets: 2
          reps: "10-20"
        - pattern: side_delt
          sets: 3
          reps: "10-20"
        - pattern: rear_delt
          sets: 2
          reps: "10-20"
        - pattern: biceps
          sets: 1
          reps: "8-15"
        - pattern: triceps
          sets: 2
          reps: "8-15"

  3d:
    label: "3 days"
    frequency_per_week: 3
    description: "Three shorter full-body sessions with moderately higher weekly volume for chest, back and delts."
    sessions:
      A:
        - pattern: squat
          sets: 2
          reps: "6-12"
        - pattern: horizontal_push
          sets: 3
          reps: "6-12"
        - pattern: vertical_pull
          sets: 2
          reps: "6-12"
        - pattern: horizontal_pull
          sets: 2
          reps: "8-15"
        - pattern: hamstring_hinge
          sets: 2
          reps: "6-12"
        - pattern: side_delt
          sets: 3
          reps: "10-20"
        - pattern: rear_delt
          sets: 2
          reps: "10-20"
        - pattern: biceps
          sets: 1
          reps: "8-15"
        - pattern: triceps
          sets: 1
          reps: "8-15"
      B:
        - pattern: squat
          sets: 2
          reps: "6-12"
        - pattern: leg_extension
          sets: 2
          reps: "10-20"
        - pattern: horizontal_push
          sets: 2
          reps: "6-12"
        - pattern: vertical_pull
          sets: 3
          reps: "6-12"
        - pattern: horizontal_pull
          sets: 2
          reps: "8-15"
        - pattern: hamstring_curl
          sets: 2
          reps: "8-15"
        - pattern: side_delt
          sets: 2
          reps: "10-20"
        - pattern: rear_delt
          sets: 1
          reps: "10-20"
        - pattern: biceps
          sets: 1
          reps: "8-15"
        - pattern: triceps
          sets: 1
          reps: "8-15"
        - pattern: abs
          sets: 2
          reps: "8-15"
          optional: true
      C:
        - pattern: squat
          sets: 2
          reps: "6-12"
        - pattern: horizontal_push
          sets: 3
          reps: "6-12"
        - pattern: vertical_pull
          sets: 2
          reps: "6-12"
        - pattern: horizontal_pull
          sets: 3
          reps: "8-15"
        - pattern: hamstring_curl
          sets: 2
          reps: "8-15"
        - pattern: side_delt
          sets: 3
          reps: "10-20"
        - pattern: rear_delt
          sets: 2
          reps: "10-20"
        - pattern: biceps
          sets: 1
          reps: "8-15"
        - pattern: triceps
          sets: 1
          reps: "8-15"

notes:
  - "The 3-day variant increases frequency while keeping each individual session shorter than the 2-day variant."
  - "RDL remains once weekly; hamstrings also receive knee-flexion work through leg curls."
  - "Exercise choice may vary inside a pattern without changing the program structure."
